name: tests

on: push

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    uses: NNPDF/workflows/.github/workflows/python-poetry-tests.yml@v2
    with:
      python-version: ${{ matrix.python-version }}
      poetry-extras: "-E complete"
